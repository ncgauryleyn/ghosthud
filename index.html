<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7wbmg</title>

  <style>
    .short-container {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 9 / 16;
      margin: 20px auto;
    }

    .short-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="short-container">
    <iframe id="youtube-short"
      title="YouTube Short"
      allowfullscreen
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share">
    </iframe>
  </div>

  <script>
    // Paste your YouTube Short link here:
    const shortUrl = "https://youtube.com/shorts/nCSZJ86HZ5I?is=cuRDEiOiB6vbjfa2";

    const videoId = new URL(shortUrl).pathname
      .split("/")
      .filter(Boolean)
      .pop();

    document.getElementById("youtube-short").src =
      "https://www.youtube.com/embed/" + videoId;
  </script>

</body>
</html>
